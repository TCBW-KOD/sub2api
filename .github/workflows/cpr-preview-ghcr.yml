name: CPR preview - verify and publish GHCR

on:
  push:
    branches:
      - feat/cpr-upstream
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpr-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'TCBW-KOD/sub2api' && github.ref == 'refs/heads/feat/cpr-upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout CPR development branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go matching backend/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install pnpm 9
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate source integration, Go tests and frontend build
        run: bash scripts/cpr-native/validate.sh

  publish:
    needs: validate
    if: github.repository == 'TCBW-KOD/sub2api' && github.ref == 'refs/heads/feat/cpr-upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the CPR preview image (amd64 only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tcbw-kod/sub2api:cpr-preview
            ghcr.io/tcbw-kod/sub2api:cpr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report preview image
        run: |
          echo "## CPR preview image published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/tcbw-kod/sub2api:cpr-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable source tag: \`ghcr.io/tcbw-kod/sub2api:cpr-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Development preview only. Database billing/real CPR end-to-end acceptance has not been completed.**" >> "$GITHUB_STEP_SUMMARY"
